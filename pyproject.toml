[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "siege"
version = "0.1.0"
description = "Adaptive AI red team for AI agents, with Cedar-enforced fixes"
readme = "Siege_Implementation_Plan.md"
requires-python = ">=3.12"
# Pinned versions: keep in sync with §6.1 of Siege_Implementation_Plan.md.
# The default install needs no cloud SDK: every role runs on local Ollama (over httpx).
dependencies = [
    "cedarpy==4.12.1",
    "fastapi==0.142.2",
    "uvicorn==0.54.0",
    "pydantic==2.13.5",
    "httpx==0.28.1",
    "pyyaml==6.0.3",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]
# Opt-in cloud providers (plan §2): only needed when a role is switched off Ollama.
cloud = ["anthropic==1.10.0", "openai==3.22.1"]

[project.scripts]
siege = "siege.cli:main"

[tool.setuptools.packages.find]
include = ["siege*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Import `siege` from the repo even when the editable-install .pth is skipped
# (macOS can flag it hidden, and Python 3.12 ignores hidden .pth files).
pythonpath = ["."]
# Unit tests never touch a real LLM; run the live ones with `pytest -m live`.
addopts = "-m 'not live'"
markers = ["live: calls a real local LLM through Ollama (run with `pytest -m live`)"]
