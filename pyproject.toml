[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "siege"
version = "0.1.0"
description = "Adaptive AI red team for AI agents, with Cedar-enforced fixes"
readme = "Siege_Implementation_Plan.md"
requires-python = ">=3.12"
# Pinned versions: keep in sync with §6.1 of Siege_Implementation_Plan.md.
dependencies = [
    "anthropic==1.10.0",
    "cedarpy==4.12.1",
    "fastapi==0.142.2",
    "uvicorn==0.54.0",
    "pydantic==2.13.5",
    "httpx==0.28.1",
    "pyyaml==6.0.3",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[project.scripts]
siege = "siege.cli:main"

[tool.setuptools.packages.find]
include = ["siege*"]
