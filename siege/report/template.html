<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Siege report</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --ink: #1b1f24; --muted: #5b6673;
    --line: #e2e6ea; --accent: #3a5bd9;
    --bad-bg: #fdecec; --bad-ink: #b3261e; --bad-line: #f3c4c0;
    --good-bg: #e9f7ee; --good-ink: #1b7f45; --good-line: #bfe6cd;
    --warn-bg: #fff6e5; --warn-ink: #9a6a00; --code: #0f172a; --code-ink: #e6edf3;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1216; --panel: #171b21; --ink: #e8ebee; --muted: #9aa5b1;
      --line: #262c34; --accent: #7aa2ff;
      --bad-bg: #2a1716; --bad-ink: #ff8f85; --bad-line: #52302c;
      --good-bg: #122017; --good-ink: #76d39a; --good-line: #294a35;
      --warn-bg: #241d0d; --warn-ink: #e3b55b; --code: #0b0e12; --code-ink: #e6edf3;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 32px 16px 64px; }
  header h1 { margin: 0 0 4px; font-size: 26px; letter-spacing: -0.02em; }
  header .sub { color: var(--muted); font-size: 14px; }
  header .meta { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 6px 18px;
    color: var(--muted); font-size: 13px; }
  header .meta b { color: var(--ink); font-weight: 600; }
  h2 { font-size: 15px; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--muted); margin: 36px 0 12px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .card .n { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; }
  .card .k { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .card.good .n { color: var(--good-ink); } .card.bad .n { color: var(--bad-ink); }
  .finding { background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    padding: 20px; margin-bottom: 20px; }
  .finding > .top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .finding h3 { margin: 0; font-size: 18px; }
  .finding .desc { color: var(--muted); margin: 6px 0 14px; }
  .pill { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 9px;
    border-radius: 999px; border: 1px solid var(--line); white-space: nowrap; }
  .pill.sev { background: var(--bad-bg); color: var(--bad-ink); border-color: var(--bad-line); }
  .pill.blocked { background: var(--good-bg); color: var(--good-ink); border-color: var(--good-line); }
  .pill.still { background: var(--bad-bg); color: var(--bad-ink); border-color: var(--bad-line); }
  .pill.notrepro { background: var(--warn-bg); color: var(--warn-ink); }
  .ba { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 4px; }
  @media (max-width: 680px) { .ba { grid-template-columns: 1fr; } }
  .panel { border-radius: 10px; padding: 12px 14px; border: 1px solid var(--line); }
  .panel.before { background: var(--bad-bg); border-color: var(--bad-line); }
  .panel.after { background: var(--good-bg); border-color: var(--good-line); }
  .panel .label { font-size: 12px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.06em; margin-bottom: 8px; }
  .panel.before .label { color: var(--bad-ink); } .panel.after .label { color: var(--good-ink); }
  .kv { font-size: 13px; color: var(--muted); margin: 2px 0; } .kv b { color: var(--ink); font-weight: 600; }
  pre { background: var(--code); color: var(--code-ink); border-radius: 8px; padding: 12px;
    overflow-x: auto; font: 12.5px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; margin: 8px 0; }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .policy { margin-top: 16px; }
  .policy .src { color: var(--muted); font-size: 13px; }
  table.dt { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 13px; }
  table.dt th, table.dt td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--line); }
  table.dt th { color: var(--muted); font-weight: 600; }
  .ok { color: var(--good-ink); font-weight: 600; } .no { color: var(--bad-ink); font-weight: 600; }
  .steps { list-style: none; padding: 0; margin: 0; }
  .steps li { padding: 8px 0; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; }
  .steps li:last-child { border-bottom: 0; }
  .banner { border-radius: 12px; padding: 14px 16px; font-weight: 600; }
  .banner.good { background: var(--good-bg); color: var(--good-ink); border: 1px solid var(--good-line); }
  .banner.bad { background: var(--bad-bg); color: var(--bad-ink); border: 1px solid var(--bad-line); }
  footer { margin-top: 40px; color: var(--muted); font-size: 12px; text-align: center; }
  .muted { color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Siege — attack &amp; defense report</h1>
    <div class="sub">Adaptive AI red team · an attack, the Cedar fix it forced, and proof the fix holds.</div>
    <!-- META -->
  </header>

  <h2>Summary</h2>
  <!-- SUMMARY -->

  <h2>Findings</h2>
  <!-- FINDINGS -->

  <h2>Happy path <span class="muted" style="text-transform:none;letter-spacing:0;font-weight:400;">— legitimate use still works</span></h2>
  <!-- HAPPY -->

  <h2>Say-only failures</h2>
  <!-- SAYONLY -->

  <footer>Generated by Siege · Team Asymptotic</footer>
</div>
</body>
</html>
